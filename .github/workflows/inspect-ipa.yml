name: Inspect an IPA from a draft release

# Owner's request (2026-10-01): compare upstream's v0.1.0 IPA with ours. The
# owner uploads the IPA to a DRAFT release of this repository (drafts are only
# visible to the repository's owners); this workflow downloads it with the
# job token, compares it with this repository's newest unsigned IPA artifact
# and writes a summary. It never re-uploads either IPA, prints no URLs, and
# replaces home-directory user names found in binaries with <user>.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release: its tag, its name, or the last part of its page address (untagged-...)"
        required: true
      asset:
        description: "Asset name filter (substring), empty = the first .ipa"
        required: false
        default: ""

permissions:
  contents: write   # drafts are only listed for tokens that can write
  actions: read

jobs:
  inspect:
    # madeira-bcd: runs only in the owner's repository; a fork's run is skipped.
    if: github.repository == 'bahacan16/madeira-bcd'
    runs-on: macos-latest
    steps:
      - name: Download the draft IPA and our newest IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          FILTER: ${{ inputs.asset }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p w && cd w
          python3 - <<'EOF' > urls.txt
          import json, os, urllib.request
          tok, repo, tag, flt = os.environ["GH_TOKEN"], os.environ["REPO"], os.environ["TAG"], os.environ["FILTER"]
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}",
                                                         "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())
          rels = get(f"https://api.github.com/repos/{repo}/releases?per_page=100")
          rel = next((r for r in rels if tag in (r["tag_name"], r["name"]) or r["html_url"].endswith("/" + tag)), None)
          if not rel: raise SystemExit(f"no release with tag {tag}")
          ipa = next((a for a in rel["assets"] if a["name"].endswith(".ipa") and flt in a["name"]), None)
          if not ipa: raise SystemExit("no matching .ipa asset")
          arts = get(f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100")["artifacts"]
          ours = sorted((a for a in arts if a["name"].endswith("-unsigned-ipa") and not a["expired"]),
                        key=lambda a: a["created_at"])[-1]
          import sys
          print(f"release '{rel['name']}' draft={rel['draft']}; theirs: {ipa['name']} ({ipa['size'] / 1e6:.1f} MB); ours: {ours['name']}", file=sys.stderr)
          print(ipa["url"]); print(ours["archive_download_url"])
          EOF
          # curl drops the token on the cross-host redirect to the signed storage URL
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o theirs.ipa "$(sed -n 1p urls.txt)"
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -o ours.zip "$(sed -n 2p urls.txt)"
          rm -f urls.txt
          unzip -q ours.zip -d ours_zip && mv ours_zip/*.ipa ours.ipa
          mkdir theirs ours && unzip -q theirs.ipa -d theirs && unzip -q ours.ipa -d ours
          rm -f theirs.ipa ours.ipa ours.zip

      - name: Compare
        run: |
          set -uo pipefail
          cd w
          S="$GITHUB_STEP_SUMMARY"
          redact() { sed -E 's#/Users/[^/ ]+#/Users/<user>#g; s#/home/[^/ ]+#/home/<user>#g'; }
          for side in theirs ours; do
            APP=$(ls -d $side/Payload/*.app | head -1)
            BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
            {
              echo "## $side"
              echo '```'
              for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion \
                       DTXcode DTXcodeBuild DTSDKName DTSDKBuild DTPlatformBuild DTCompiler BuildMachineOSBuild \
                       MadeiraCommit MadeiraRepo MadeiraBuilt; do
                printf '%-28s %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo '-')"
              done
              echo "signature: $(codesign -dv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature=' | tr '\n' ' ' || true)"
              echo "binary: $(stat -f%z "$BIN") bytes; $(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/(minos|sdk)/{printf "%s ", $0} /LC_SOURCE_VERSION/{f=0}')"
              echo "build paths in the binary (user names redacted):"
              strings -a "$BIN" | grep -oE '(/Users/[^/ ]+|/home/[^/ ]+|/Volumes/[^/ ]+)/[A-Za-z0-9._-]+' | redact | sort | uniq -c | sort -rn | head -8
              echo "app bundle: $(find "$APP" -type f | wc -l | tr -d ' ') files, $(du -sk "$APP" | cut -f1) KB"
              echo '```'
            } >> "$S"
            (cd "$APP" && find . -type f -exec shasum -a 1 {} + | awk '{print $2" "$1}' | sort) > $side.sha
            (cd "$APP" && find . -type f -exec stat -f '%N %z' {} + | sort) > $side.size
          done
          {
            echo "## Differences (files inside the .app)"
            echo '```'
            echo "only in theirs: $(comm -23 <(cut -d' ' -f1 theirs.sha) <(cut -d' ' -f1 ours.sha) | wc -l | tr -d ' ')"
            comm -23 <(cut -d' ' -f1 theirs.sha) <(cut -d' ' -f1 ours.sha) | head -60
            echo
            echo "only in ours: $(comm -13 <(cut -d' ' -f1 theirs.sha) <(cut -d' ' -f1 ours.sha) | wc -l | tr -d ' ')"
            comm -13 <(cut -d' ' -f1 theirs.sha) <(cut -d' ' -f1 ours.sha) | head -60
            echo
            echo "in both, identical: $(comm -12 theirs.sha ours.sha | wc -l | tr -d ' ')"
            echo "in both, different (theirs size -> ours size), largest first:"
            join <(comm -23 theirs.sha ours.sha | cut -d' ' -f1 | sort) <(comm -13 theirs.sha ours.sha | cut -d' ' -f1 | sort) \
              | while read -r f; do
                  a=$(grep -F "$f " theirs.size | head -1 | awk '{print $NF}'); b=$(grep -F "$f " ours.size | head -1 | awk '{print $NF}')
                  echo "$a $b $f"
                done | sort -rn | head -60 | awk '{printf "%10s -> %10s  %s\n", $1, $2, $3}'
            echo '```'
          } >> "$S"
          cat "$S"
          cd .. && rm -rf w
