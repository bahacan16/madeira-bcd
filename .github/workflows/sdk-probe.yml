name: SDK probe

# madeira-bcd: prints what the CI Xcode's iOS SDK declares for a framework, so
# code against a new API (MetalFX frame interpolation) is written from the real
# headers instead of guessed and fixed one 18-minute IPA build at a time.
# Read-only: builds nothing, publishes nothing.

on:
  workflow_dispatch:
  push:
    branches: [claude/madeira-bcd-repo-ymg5cb]
    paths:
      - .github/workflows/sdk-probe.yml

jobs:
  probe:
    # madeira-bcd: runs only in the owner's repository; a fork's run is skipped.
    if: github.repository == 'bahacan16/madeira-bcd'
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, macos-26]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      # Which Xcodes (and Swift compilers) each runner image carries: the
      # prebuilt StikJIT.xcframework's interface needs Swift 6.4.
      - name: Installed Xcodes
        shell: bash
        run: |
          set +e +o pipefail
          sw_vers
          ALL=""
          for X in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V); do
            V=$(DEVELOPER_DIR="$X/Contents/Developer" xcodebuild -version 2>/dev/null || true)
            V=${V%%$'\n'*}; V=${V#Xcode }
            S=$(DEVELOPER_DIR="$X/Contents/Developer" xcrun swift --version 2>&1 || true)
            S=$(sed -nE 's/.*Swift version ([0-9.]+).*/\1/p' <<< "$S")
            echo "$X Xcode $V Swift $S"
            ALL="$ALL ${X#/Applications/}=$V/$S;"
          done
          echo "::notice::${{ matrix.image }}:$ALL"
