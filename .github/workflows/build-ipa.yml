name: Build Madeira IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build-ipa.yml"]

# A push and a manual dispatch seconds apart used to start two parallel
# multi-hour macOS jobs on the same commit.
concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version

      # --- UNVERIFIED: exact configure invocation for the wine fork's
      # iOS/arm64 cross target isn't documented anywhere in the repo.
      # This is a best guess and will likely need correcting once we see
      # the real error.
      - name: Install newer bison (macOS ships an ancient 2.3)
        run: |
          brew install bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Install llvm (need lld/llvm-dlltool for aarch64-windows PE cross target)
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: "Build native wine (for host-side tools: widl/wrc/wmc)"
        run: |
          cd wine
          mkdir -p build-native
          cd build-native
          ../configure > "$GITHUB_WORKSPACE/wine-native-configure.log" 2>&1 || true
          make -j"$(sysctl -n hw.ncpu)" > "$GITHUB_WORKSPACE/wine-native-make.log" 2>&1 || true

      - name: Diagnose native wine tools build
        run: |
          echo "-- looking for widl (proof the native tools built) --"
          find wine/build-native/tools -maxdepth 2 -name "widl*" 2>&1 || echo "not found"
          if [ ! -x wine/build-native/tools/widl/widl ]; then
            echo "::error::native widl NOT built -- dumping tails"
            NCTAIL=$(tail -n 30 wine-native-configure.log 2>/dev/null | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
            echo "::error::native configure TAIL :: $NCTAIL"
            NMTAIL=$(tail -n 40 wine-native-make.log 2>/dev/null | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
            echo "::error::native make TAIL :: $NMTAIL"
          else
            echo "::notice::native widl built OK"
          fi

      - name: Configure wine (build-macos, cross)
        run: |
          cd wine
          mkdir -p build-macos
          cd build-macos
          ../configure --enable-win64 --disable-tests \
            CC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0" \
            CROSSCC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0" \
            --host=aarch64-apple-darwin --build=x86_64-apple-darwin \
            --with-wine-tools="$GITHUB_WORKSPACE/wine/build-native" \
            --without-freetype --without-fontconfig \
            --without-x --without-opengl --without-vulkan \
            --without-gnutls --without-pcsclite --without-usb \
            --without-v4l2 --without-gphoto --without-inotify \
            --without-sane --without-pulse --without-alsa --without-oss \
            --without-capi --without-cups --without-krb5 --without-ldap \
            --without-netapi --without-sdl --without-udev --without-unwind \
            > "$GITHUB_WORKSPACE/wine-configure.log" 2>&1 || true

      - name: Generate cross-tree headers and patch config.h for iOS SDK
        shell: bash
        run: |
          make -C wine/build-macos include -j"$(sysctl -n hw.ncpu)" > "$GITHUB_WORKSPACE/make-include.log" 2>&1 || true
          cp -n wine/build-native/include/*.h wine/build-macos/include/ 2>/dev/null || true
          CFG=wine/build-macos/include/config.h
          {
            echo ""
            echo "/* iOS SDK fixups appended by CI */"
            echo "#undef HAVE_GETATTRLIST"
            echo "#ifndef D_TAPE"
            echo "#define D_TAPE 1"
            echo "#endif"
            echo "#ifndef D_DISK"
            echo "#define D_DISK 2"
            echo "#endif"
            echo "#ifndef D_TTY"
            echo "#define D_TTY 3"
            echo "#endif"
          } >> "$CFG"
          if [ -f wine/build-macos/include/dwrite.h ]; then
            echo "::notice::dwrite.h present in cross tree"
          else
            echo "::error::dwrite.h STILL MISSING"
            LS=$(ls wine/build-native/include/ 2>&1 | head -40 | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
            echo "::error::native include dir :: $LS"
            T=$(tail -n 20 "$GITHUB_WORKSPACE/make-include.log" 2>/dev/null | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
            echo "::error::make include tail :: $T"
          fi

      - name: Diagnose wine build-macos state
        run: |
          echo "-- listing wine/build-macos (depth 2) --"
          find wine/build-macos -maxdepth 2 2>&1 | head -60 || echo "wine/build-macos missing entirely"
          if [ -f wine/build-macos/include/config.h ]; then
            echo "::notice::config.h EXISTS, $(wc -l < wine/build-macos/include/config.h) lines"
          else
            echo "::error::config.h MISSING at wine/build-macos/include/config.h -- configure did not actually produce it"
            LINES=$(wc -l < wine-configure.log 2>/dev/null || echo 0)
            echo "::error::wine-configure.log has $LINES lines total"
            HEAD=$(head -n 25 wine-configure.log 2>/dev/null | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
            echo "::error::configure HEAD :: $HEAD"
            TAIL=$(tail -n 40 wine-configure.log 2>/dev/null | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
            echo "::error::configure TAIL :: $TAIL"
          fi

      - name: Clone freetype 2.13.3
        run: git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype

      - name: Build freetype-ios
        run: bash build/freetype-ios/build.sh

      - name: Build ntdll-unix
        run: bash build/ntdll-unix/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ntdll.log"; exit ${PIPESTATUS[0]}

      - name: Build base libwineserver.a from wine/server sources
        shell: bash
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          BD="$GITHUB_WORKSPACE/build/wineserver"
          OBJ="$BD/obj"
          mkdir -p "$OBJ/base"
          FLAGS=(-arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 -O2
            -I"$GITHUB_WORKSPACE/wine/include" -I"$GITHUB_WORKSPACE/wine/include/wine"
            -I"$GITHUB_WORKSPACE/wine/build-macos/include"
            -I"$BD" -I"$GITHUB_WORKSPACE/wine/server"
            -I"$GITHUB_WORKSPACE/build/ntdll-unix/shims"
            -include "$BD/config_ios.h" -include stdarg.h
            -include "$BD/unicode_fix.h" -include "$BD/wineserver_ios_kill.h"
            -DBINDIR=\"/usr/local/bin\" -DDATADIR=\"/usr/local/share\"
            -D__WINESRC__ -DWINE_IOS=1 -Dmain=wineserver_main
            -Wno-implicit-function-declaration)
          OK=0; BAD=0; BADLIST=""
          for src in "$GITHUB_WORKSPACE"/wine/server/*.c; do
            n=$(basename "$src" .c)
            if xcrun -sdk iphoneos clang "${FLAGS[@]}" -c "$src" -o "$OBJ/base/$n.o" 2>"$OBJ/base/$n.err"; then
              OK=$((OK+1))
            else
              BAD=$((BAD+1)); BADLIST="$BADLIST $n"
            fi
          done
          echo "base compile: $OK ok, $BAD failed:$BADLIST"
          echo "::notice::base wineserver compile :: $OK ok, $BAD failed:$BADLIST"
          ar rcs "$OBJ/libwineserver.a" "$OBJ"/base/*.o
          echo "::notice::base libwineserver.a $(wc -c < "$OBJ/libwineserver.a" | tr -d ' ') bytes"
          # surface the first few real failures so we can judge if any matter
          M=0
          for f in $(grep -rl "error:" "$OBJ/base" --include="*.err" 2>/dev/null | head -3); do
            M=$((M+1))
            MSG=$(grep -m3 -A3 "error:" "$f" | head -c 1200 | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
            echo "::error::base compile error in $f :: $MSG"
          done

      - name: Build wineserver
        run: bash build/wineserver/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/wineserver.log"; exit ${PIPESTATUS[0]}

      - name: Build win32u-unix
        run: bash build/win32u-unix/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/win32u.log"; exit ${PIPESTATUS[0]}

      - name: Install ninja/meson and fetch llvm-mingw
        shell: bash
        run: |
          brew install ninja meson
          mkdir -p toolchains
          curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz \
            | tar -xJ -C toolchains/ || echo "::error::llvm-mingw download failed"
          ls toolchains/

      # The Xcode project links 7 archives out of FEX/build-ios/ -- FEXCore,
      # FEXCore_Base, JemallocLibs plus the External deps. Nothing built them
      # before, so archiving could never have linked.
      - name: Cache FEX iOS build
        id: fexcache
        uses: actions/cache@v4
        with:
          path: FEX/build-ios
          key: fex-ios-053c385-v1
          # Without this a later failing step throws away the build we just did.
          save-always: true

      # Upstream bug in the ios-port branch: the [ffs-bypass] and [cb-entry]
      # diagnostic blocks sit AFTER the #endif that closes the FEX_IOS_HOST
      # section, but the buffers they read (IosCbEntryLog, IosFfsBypassLog)
      # are only declared inside it -- 14 "undeclared identifier" errors.
      # Defining FEX_IOS_HOST is not the fix: IosJitReverseTranslate and
      # IosFfsBypassLog are defined under Source/Windows/ARM64EC/, which
      # `if (NOT APPLE)` excludes from this build, so we would trade compile
      # errors for undefined symbols. These blocks only print debug logs, so
      # move them inside the #ifdef where their declarations live.
      - name: Patch FEX diagnostic probes for the iOS static-lib target
        if: steps.fexcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys

          def patch(path, start, end, guard, label):
              p = pathlib.Path(path)
              s = p.read_text()
              if guard + "\n" + start in s:
                  print(f"{label}: already patched"); return
              if s.count(start) != 1 or s.count(end) != 1:
                  print(f"::error::{label}: patch anchors not unique -- upstream changed, review needed")
                  sys.exit(1)
              s = s.replace(start, guard + "\n" + start)
              s = s.replace(end, end + ("#endif\n" if end.endswith("\n") else "\n#endif"))
              p.write_text(s)
              print(f"{label}: patched")

          # [ffs-bypass] / [cb-entry] probes sit after the #endif that closes the
          # FEX_IOS_HOST section, but read buffers declared only inside it.
          patch("FEX/FEXCore/Source/Interface/Core/Core.cpp",
                "  {\n    static uint64_t FfsLastCount = 0;",
                "IosCbEntryLog[4], IosCbEntryLog[5], IosCbEntryLog[7]);\n    }\n  }\n",
                "#ifdef FEX_IOS_HOST", "Core.cpp")

          # [caspal128] probe calls VirtualQuery/MEMORY_BASIC_INFORMATION with no
          # guard at all. Those exist on the ARM64EC/PE target, not on iOS.
          patch("FEX/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp",
                "  MEMORY_BASIC_INFORMATION mbi {};",
                "                    mbi.Protect, type, mbi.State);",
                "#ifndef __APPLE__", "Arm64.cpp")
          PYEOF

      - name: Build FEX for iOS
        if: steps.fexcache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          # Apple builds skip Source/ (Linux-only tools) via `if (NOT APPLE)`,
          # so only the libraries Xcode links get built.
          # CMAKE_SYSTEM_NAME=iOS puts CMake in cross mode, where it does not
          # infer CMAKE_SYSTEM_PROCESSOR -- FEX's CMakeLists.txt:89 then does
          # string(TOLOWER) on an empty value and aborts with "Unsupported
          # processor type ." Its regex accepts ^aarch64.
          cmake -S FEX -B FEX/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DBUILD_TESTING=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_THUNKS=OFF \
            -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF \
            -DTUNE_CPU=generic -DTUNE_ARCH=generic \
            -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON \
            > "$GITHUB_WORKSPACE/fex-cfg.log" 2>&1
          # Explicit targets: `all` would also build FEXCore_shared, which we
          # don't link and which needs dylib settings iOS won't give us.
          cmake --build FEX/build-ios -j"$(sysctl -n hw.ncpu)" \
            --target FEXCore FEXCore_Base JemallocLibs \
                     cephes_128bit softfloat_3e fmt xxhash \
            > "$GITHUB_WORKSPACE/fex-build.log" 2>&1

      - name: Verify FEX iOS archives
        if: always()
        shell: bash
        run: |
          set +e
          OK=1
          for a in FEXCore/Source/libFEXCore.a FEXCore/Source/libFEXCore_Base.a \
                   FEXCore/Source/libJemallocLibs.a External/cephes/libcephes_128bit.a \
                   External/fmt/libfmt.a External/SoftFloat-3e/libsoftfloat_3e.a \
                   External/xxhash/cmake_unofficial/libxxhash.a; do
            if [ -f "FEX/build-ios/$a" ]; then
              echo "  OK   $a ($(wc -c < "FEX/build-ios/$a" | tr -d ' ') bytes)"
            else
              echo "  MISS $a"; OK=0
            fi
          done
          if [ "$OK" -eq 0 ]; then
            for L in fex-cfg fex-build; do
              if [ -f "$L.log" ]; then
                # Compiler errors beat a blind tail: the real cause is usually
                # hundreds of lines above the end of a ninja log.
                E=$(grep -E "error:|CMake Error" "$L.log" | head -20)
                [ -n "$E" ] || E=$(tail -n 40 "$L.log")
                echo "::error::$L.log :: $(printf '%s' "$E" | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")"
              else
                echo "::error::$L.log MISSING"
              fi
            done
            exit 1
          fi
          echo "::notice::all 7 FEX archives present"

      # --- UNVERIFIED: don't know Madeira's required LLVM branch/cmake
      # flags for the DXMT airconv shader compiler. This will take real
      # time (~1-3h) even once the flags are right.
      - name: Cache LLVM 15.0.7 iOS build
        id: llvmcache
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-ios-build
            toolchains/llvm-project
          key: llvm-15.0.7-ios-v2
          save-always: true

      - name: Build LLVM 15.0.7 for iOS (two-stage, per build/dxmt-ios/README.md)
        if: steps.llvmcache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          git clone --depth 1 --branch llvmorg-15.0.7 \
            https://github.com/llvm/llvm-project.git toolchains/llvm-project
          # README: Apple ld rejects --gc-sections; make the Darwin branch cover iOS
          sed -i '' 's/MATCHES "Darwin"/MATCHES "Darwin|iOS"/' \
            toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake
          grep -n 'Darwin|iOS' toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake | head

          # stage 1: host llvm-tblgen only (use Xcode clang, not brew's newer one)
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DLLVM_TARGETS_TO_BUILD="" -DLLVM_INCLUDE_TESTS=Off \
            -DLLVM_INCLUDE_EXAMPLES=Off -DLLVM_INCLUDE_BENCHMARKS=Off \
            > "$GITHUB_WORKSPACE/llvm-host-cfg.log" 2>&1
          cmake --build toolchains/llvm-host-build --target llvm-tblgen \
            -j"$(sysctl -n hw.ncpu)" > "$GITHUB_WORKSPACE/llvm-host-build.log" 2>&1

          # stage 2: iOS target libs, reusing host tblgen
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DLLVM_TABLEGEN="$GITHUB_WORKSPACE/toolchains/llvm-host-build/bin/llvm-tblgen" \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DLLVM_BUILD_UTILS=Off -DLLVM_BUILD_TOOLS=Off \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_INCLUDE_TESTS=Off -DLLVM_INCLUDE_EXAMPLES=Off \
            -DLLVM_INCLUDE_BENCHMARKS=Off -DLLVM_INCLUDE_UTILS=Off \
            -DLLVM_ENABLE_TERMINFO=Off -DLLVM_ENABLE_LIBXML2=Off \
            -DLLVM_ENABLE_ZSTD=Off -DLLVM_ENABLE_ZLIB=Off \
            > "$GITHUB_WORKSPACE/llvm-ios-cfg.log" 2>&1
          cmake --build toolchains/llvm-ios-build -j"$(sysctl -n hw.ncpu)" \
            > "$GITHUB_WORKSPACE/llvm-ios-build.log" 2>&1

      - name: Verify LLVM iOS build
        if: always()
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          LIBS=(toolchains/llvm-ios-build/lib/*.a)
          N=${#LIBS[@]}
          echo "llvm-ios-build static libs: $N"
          echo "::notice::llvm-ios-build has $N static libs"
          echo "-- toolchains tree --"
          ls -la toolchains 2>&1 | head -20
          ls -la toolchains/llvm-ios-build 2>&1 | head -20
          if [ "$N" -lt 5 ]; then
            for L in llvm-host-cfg llvm-host-build llvm-ios-cfg llvm-ios-build; do
              if [ -f "$L.log" ]; then
                T=$(tail -n 30 "$L.log" | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
                echo "::error::$L.log tail :: $T"
              else
                echo "::error::$L.log MISSING"
              fi
            done
            exit 1
          fi

      # Needed to compile the .metal shaders below, so it has to happen before
      # dxmt-ios rather than just before xcodebuild.
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # build/dxmt-ios/shader-headers/ is gitignored and nothing generated it,
      # so airconv_context.cpp could not find air_msad.h / air_samplepos.h.
      # Mirrors the metalir + hexdump generators in research/dxmt/meson.build.
      - name: Generate DXMT shader headers
        shell: bash
        run: |
          SHADERS="$GITHUB_WORKSPACE/research/dxmt/src/airconv/shaders"
          OUT="$GITHUB_WORKSPACE/build/dxmt-ios/shader-headers"
          mkdir -p "$OUT"
          cd "$OUT"
          for s in air_msad air_samplepos air_tessellation; do
            xcrun -sdk macosx metal -o "$s.air" -c "$SHADERS/$s.metal" \
              -std=metal3.1 --target=air64-apple-macos14.0
            # meson passes `xxd -n <basename>`; that flag is not in every xxd,
            # so rename the symbols instead (air_msad_air -> air_msad).
            xxd -i "$s.air" | sed "s/${s}_air/${s}/g" > "$s.h"
          done
          ls -la

      - name: Build dxmt-ios
        shell: bash
        run: |
          set +e
          bash build/dxmt-ios/build.sh
          rc=$?
          if [ "$rc" -ne 0 ]; then
            for f in build/dxmt-ios/obj/*.err; do
              [ -s "$f" ] || continue
              grep -q "error:" "$f" || continue
              echo "===== $f ====="
              grep -m 10 -B2 -A6 "error:" "$f"
            done
          fi
          exit "$rc"

      - name: Combine DXMT + LLVM into libdxmt_combined.a
        shell: bash
        run: |
          cd build/dxmt-ios
          xcrun -sdk iphoneos libtool -static -o libdxmt_combined.a \
            obj/*.o "$GITHUB_WORKSPACE"/toolchains/llvm-ios-build/lib/*.a
          cp libdxmt_combined.a "$GITHUB_WORKSPACE/app/Madeira/"
          echo "::notice::libdxmt_combined.a $(wc -c < libdxmt_combined.a | tr -d ' ') bytes"

      # The PE-side DXMT DLLs (d3d11/dxgi/winemetal/d3d10core) are committed
      # under app/Madeira/aarch64-windows/ despite the README calling them
      # gitignored, so there is nothing to build here -- just confirm they
      # are present before we try to archive.
      - name: Verify committed PE DLLs
        shell: bash
        run: |
          MISSING=""
          for d in d3d11.dll dxgi.dll winemetal.dll d3d10core.dll; do
            [ -f "app/Madeira/aarch64-windows/$d" ] || MISSING="$MISSING $d"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::PE DLLs missing from app/Madeira/aarch64-windows/ ::$MISSING"
            exit 1
          fi
          echo "::notice::all four PE DLLs present"

      - name: vcruntime reminder
        run: cat tools/fetch-vcruntime.md

      # Fail here with a clear list rather than deep inside a linker error.
      - name: Verify all linked archives exist
        shell: bash
        run: |
          set +e
          MISSING=""
          for a in libgmp.a libgnutls.a libhogweed.a libnettle.a \
                   libntdll_unix.a libwin32u_unix.a libwineserver.a \
                   libdxmt_combined.a; do
            [ -f "app/Madeira/$a" ] || MISSING="$MISSING app/Madeira/$a"
          done
          for a in FEXCore/Source/libFEXCore.a FEXCore/Source/libFEXCore_Base.a \
                   FEXCore/Source/libJemallocLibs.a External/cephes/libcephes_128bit.a \
                   External/fmt/libfmt.a External/SoftFloat-3e/libsoftfloat_3e.a \
                   External/xxhash/cmake_unofficial/libxxhash.a; do
            [ -f "FEX/build-ios/$a" ] || MISSING="$MISSING FEX/build-ios/$a"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::archives missing before archive step ::$MISSING"
            exit 1
          fi
          echo "::notice::all 15 linked archives present"

      - name: Archive (unsigned)
        run: |
          xcodebuild -project app/Madeira.xcodeproj \
            -scheme Madeira -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build-out/Madeira.xcarchive

      - name: Package unsigned IPA
        run: |
          mkdir -p build-out/Payload
          cp -R build-out/Madeira.xcarchive/Products/Applications/Madeira.app build-out/Payload/
          cd build-out && ditto -c -k --keepParent Payload Madeira-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madeira-unsigned-ipa
          path: build-out/Madeira-unsigned.ipa
          if-no-files-found: ignore

      # Full logs as an artifact -- the annotations above are truncated, and
      # digging them out of the raw job log is painful.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore

      - name: Dump first build errors (on failure)
        if: failure()
        shell: bash
        run: |
          for L in ntdll wineserver win32u; do
            if [ -f "$L.log" ]; then
              T=$(grep -E "^(Results:|Failed:|ERROR)" "$L.log" | head -5 | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
              echo "::error::$L.log summary :: $T"
            fi
          done
          N=0
          for f in $(grep -rl "error:" build --include="*.err" 2>/dev/null | head -4); do
            N=$((N+1))
            MSG=$(grep -A4 -m3 "error:" "$f" | head -c 1500 | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
            echo "::error::REAL ERROR in $f :: $MSG"
          done
          if [ "$N" -eq 0 ]; then
            echo "::error::no .err file contains 'error:' -- failure is from a script exit or ar/link stage"
            for L in ntdll wineserver win32u; do
              if [ -f "$L.log" ]; then
                T=$(tail -n 25 "$L.log" | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
                echo "::error::$L.log tail :: $T"
              fi
            done
          fi
